<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Favicons & App Icons -->
    <link rel="icon" type="image/png" href="/logo2.png" />
    <link rel="shortcut icon" type="image/png" href="/logo2.png" />
    <link rel="apple-touch-icon" href="/logo2.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO Meta Tags -->
    <title>Mactis IT Services | Enterprise Software, Cloud & AI Engineering</title>
    <meta name="description" content="Mactis IT Services is an enterprise software engineering and digital transformation consultancy specializing in high-throughput cloud platforms, autonomous AI pipelines, and mission-critical distributed systems." />
    <meta name="keywords" content="Mactis, Mactis IT Services, enterprise software engineering, cloud architecture, AI systems, Next.js, React 19, Python, PyTorch, Kubernetes, AWS, microservices, digital transformation" />
    <meta name="author" content="Mactis IT Services" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://mactis.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mactis IT Services" />
    <meta property="og:title" content="Mactis IT Services | Enterprise Software & AI Systems" />
    <meta property="og:description" content="Architecting resilient enterprise software, high-throughput AI pipelines, and distributed cloud systems for global business scale." />
    <meta property="og:image" content="/images/hero_enterprise.jpg" />
    <meta property="og:url" content="https://mactis.com/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mactis IT Services | Enterprise Software & AI Systems" />
    <meta name="twitter:description" content="Architecting resilient enterprise software, high-throughput AI pipelines, and distributed cloud systems for global business scale." />
    <meta name="twitter:image" content="/images/hero_enterprise.jpg" />

    <!-- Theme Colors -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="dark light" />

    <!-- Structured Data (JSON-LD) for Google SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Mactis IT Services",
        "url": "https://mactis.com/",
        "logo": "https://mactis.com/logo2.png",
        "description": "Enterprise software consultancy specializing in custom cloud architectures, generative AI systems, and distributed platforms.",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Global"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "telephone": "+92-315-4327855",
          "contactType": "sales",
          "availableLanguage": ["English", "Urdu"]
        },
        "sameAs": [
          "https://github.com/Hassansaeedd"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
